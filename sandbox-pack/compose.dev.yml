# Local digest registry for TRUSTED_DOCKER artifact-runtime images.
# Started by Start-SandboxPack(.ps1|.sh) or root `docker compose --profile sandbox-registry up`.
# This is NOT the app/UI stack — see root docker-compose.yml / deploy/Dockerfile for Control Plane + GUI.
# TRUSTED_DOCKER remains ordinary runc with --network none; not gVisor/Kata; not VERIFIED.
name: veyrion-sandbox-dev

services:
  registry:
    image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

volumes:
  registry-data:
